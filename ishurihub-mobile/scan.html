<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IshuriHUB Mobile — Live Deployment</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #064e3b;
      background: radial-gradient(circle at 50% 20%, #065f46 0%, #022c22 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #022c22;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .qr-container {
      background: white;
      padding: 16px;
      border-radius: 14px;
      display: inline-block;
      margin: 10px 0 20px 0;
    }
    .qr-container img {
      width: 240px;
      height: 240px;
      display: block;
    }
    .url-box {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      font-family: monospace;
      font-size: 16px;
      color: #34d399;
      word-break: break-all;
      margin-bottom: 20px;
      user-select: all;
    }
    .btn {
      display: block;
      background-color: #10b981;
      color: #022c22;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 10px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: #059669;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 LIVE ON CLOUDFLARE</div>
    <h1>IshuriHUB Mobile</h1>
    <p>Deployed globally on Cloudflare Pages. Scan with your phone or click below to launch.</p>
    
    <div class="qr-container">
      <img src="deployed-qr.svg" alt="Scan QR Code">
    </div>

    <div class="url-box">
      https://ishurihub-mobile.pages.dev
    </div>

    <a href="https://ishurihub-mobile.pages.dev" target="_blank" class="btn">
      Open Live Application &rarr;
    </a>
  </div>
</body>
</html>
